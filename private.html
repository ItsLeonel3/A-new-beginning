<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b10">
    <meta name="description" content="Códigos escolares privados de LEOBAY23">
    <title>Códigos Escolares</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="private-page">
    <div class="glow a"></div>
    <div class="glow b"></div>

    <header>
        <img src="images/descarga-removebg-preview.png" alt="Logo de la institución" class="school-logo" width="185" height="80">
        <nav>
            <a href="index.html">Inicio</a>
        </nav>
    </header>

    <main>
        <section class="section private-section">
    <small>03 // PRIVATE</small>

    <div class="school-header">
        <div>
            <h1>Códigos <span>Escolares</span></h1>
            <p>Material privado disponible después de autenticarte.</p>
        </div>

        <div class="school-actions">
            <button class="btn cyan" id="addCodeButton">
                ＋ Agregar código
            </button>

            <button class="btn" id="schoolLock">
                🔒 Cerrar sesión
            </button>
        </div>
    </div>

    <div id="addCodePanel" class="card add-code-panel">
        <label>NEW CODE</label>

        <h3>Agregar código escolar</h3>

        <form id="addCodeForm">

            <div class="form-group">
                <label for="codeTitle">Título</label>
                <input
                    id="codeTitle"
                    type="text"
                    placeholder="Ej: Ejercicio de herencia"
                    required
                >
            </div>

            <div class="form-group">
                <label for="codeDescription">Descripción</label>
                <input
                    id="codeDescription"
                    type="text"
                    placeholder="Descripción del trabajo"
                >
            </div>

            <div class="form-group">
                <label for="codeLanguage">Lenguaje</label>

                <select id="codeLanguage" required>
                    <option value="">Seleccionar lenguaje</option>
                    <option value="Python">Python</option>
                    <option value="Arduino">Arduino</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="HTML">HTML</option>
                    <option value="CSS">CSS</option>
                    <option value="Java">Java</option>
                    <option value="C">C</option>
                    <option value="C++">C++</option>
                    <option value="C#">C#</option>
                    <option value="SQL">SQL</option>
                    <option value="PHP">PHP</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="codeContent">Código</label>

                <textarea
                    id="codeContent"
                    placeholder="Pegá tu código acá..."
                    spellcheck="false"
                    required
                ></textarea>
            </div>

            <div class="form-actions">
                <button class="btn cyan" type="submit">
                    Guardar código
                </button>

                <button class="btn" type="button" id="cancelCode">
                    Cancelar
                </button>
            </div>

            <span id="addCodeMessage" class="password-message"></span>
        </form>
    </div>

    <div id="codeStatus" class="card code-status">
        Cargando códigos...
    </div>

    <div id="codeGrid" class="grid school-grid"></div>
</section>
    </main>

    <footer>
        <b>LEOBAY23</b>
        <span>PRIVATE // AUTHENTICATED</span>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/private.js"></script>
</body>
</html>
