<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b10">
    <meta name="description" content="Acceso">
    <title>Proyectos — Acceso</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="private-page">
    <div class="glow a"></div>
    <div class="glow b"></div>

    <header>
        <nav>
            <a href="index.html">Volver</a>
        </nav>
    </header>

    <main>
        <section class="section private-section">
            <small>PRIVADO</small>
            <h1>Proyectos <span>Privados</span></h1>
            <p>
                Un espacio protegido para descargar y administrar trabajos y proyectos comprimidos.
            </p>

            <div class="school-login card" id="schoolLogin">
                <div class="icon">🔒</div>

                <div class="school-login-content">
                    <label>ACCESO REQUERIDO</label>
                    <h3>Zona protegida</h3>
                    <p>Introducí la contraseña para continuar.</p>

                    <form class="password-row" id="loginForm">
                        <input
                            id="schoolPassword"
                            type="password"
                            placeholder="Contraseña"
                            autocomplete="current-password"
                            required
                        >

                        <button class="btn cyan" type="submit">
                            Entrar
                        </button>
                    </form>

                    <span class="password-message" id="schoolMessage"></span>
                </div>
            </div>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/private.js"></script>
</body>
</html>
