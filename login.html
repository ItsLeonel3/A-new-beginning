<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b10">
    <meta name="description" content="Acceso a códigos escolares de LEOBAY23">

<body class="private-page">

    <header>
        <a class="brand" href="index.html"><b>LEO</b>BAY23</a>
        <nav>
            <a href="index.html">Volver</a>

    <main>
        <section class="section private-section">
            <small>03 // PRIVATE</small>
            <h1>Códigos <span>Escolares</span></h1>
            <p>Un espacio privado para guardar y consultar códigos de trabajos escolares.</p>

            <div class="school-login card" id="schoolLogin">
                <div class="icon">🔒</div>
                <div class="school-login-content">
                    <label>ACCESS REQUIRED</label>
                    <h3>Zona protegida</h3>
                    <p>Introducí la contraseña para continuar.</p>

                    <form class="password-row" id="loginForm">
                        <input id="schoolPassword" type="password" placeholder="Contraseña" autocomplete="current-password" required>
                        <button class="btn cyan" type="submit">Entrar</button>
                    </form>

                    <span class="password-message" id="schoolMessage"></span>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <b>LEOBAY23</b>
        <span>PRIVATE // ACCESS REQUIRED</span>
    </footer>
